name: Remove Experimental Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to clean up"
        required: true
        type: string
  pull_request:
    types: [ closed ]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  remove:
    environment:
      name: "dev"
    runs-on: ubuntu-24.04
    steps:
      - name: Echo PR#
        env:
          PR: ${{ inputs.pr_number || github.event.number }}
        run: echo "Your PR is ${PR}"

      # Checkout the code
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Setup Node
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Setup Python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Configure AWS credentials for GitHub Actions
      - name: Configure AWS credentials for GitHub Actions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Cleanup all ephemeral resources
        id: cleanup
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          ENVIRONMENT_NAME: dev
        run: |
          set -uo pipefail

          if [[ -z "${PR_NUMBER}" || ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "A numeric PR number is required for ephemeral cleanup." >&2
            exit 1
          fi

          failures=()

          record_failure() {
            local label="$1"
            failures+=("${label}")
            echo "::error title=Ephemeral cleanup failed::${label}" >&2
          }

          retry() {
            local attempts=1
            local max_attempts=3
            local delay=10

            until "$@"; do
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          retry_aws() {
            local error_file="$1"
            local not_found_pattern="$2"
            shift 2
            local attempts=1
            local max_attempts=3
            local delay=10

            : >"${error_file}"
            until "$@" 2>"${error_file}"; do
              if [ -n "${not_found_pattern}" ] && grep -qiE "${not_found_pattern}" "${error_file}"; then
                return 2
              fi
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          stack_state() {
            local stack_name="$1"
            local error_file
            error_file=$(mktemp)

            retry_aws "${error_file}" 'does not exist|not exist' \
              aws cloudformation describe-stacks --stack-name "${stack_name}" >/dev/null
            local state=$?
            if [ "${state}" -eq 0 ]; then
              rm -f "${error_file}"
              return 0
            fi

            if [ "${state}" -eq 2 ]; then
              rm -f "${error_file}"
              return 1
            fi

            record_failure "Inspect CloudFormation stack ${stack_name}: $(tr '\n' ' ' <"${error_file}")"
            rm -f "${error_file}"
            return 2
          }

          destroy_stack() {
            local stack_name="$1"
            local state

            stack_state "${stack_name}"
            state=$?
            case "${state}" in
              1)
                echo "Stack already absent: ${stack_name}"
                return 0
                ;;
              2)
                return 1
                ;;
            esac

            echo "Destroying stack: ${stack_name}"
            if ! retry aws cloudformation delete-stack --stack-name "${stack_name}"; then
              record_failure "CloudFormation stack ${stack_name}"
              return
            fi

            if ! retry aws cloudformation wait stack-delete-complete --stack-name "${stack_name}"; then
              record_failure "CloudFormation stack deletion ${stack_name}"
            fi
          }

          invoke_dropdb() {
            local function_name="cms-eregs-eph-${PR_NUMBER}-dropdb"
            local metadata_file
            local payload_file
            local invoke_status
            local error_file
            local database_status

            error_file=$(mktemp)
            retry_aws "${error_file}" 'ResourceNotFoundException|Function not found|does not exist' \
              aws lambda get-function --function-name "${function_name}" >/dev/null
            local state=$?
            if [ "${state}" -ne 0 ]; then
              if [ "${state}" -eq 2 ]; then
                record_failure "Missing cleanup Lambda ${function_name}; database deletion cannot be verified"
              else
                record_failure "Inspect cleanup Lambda ${function_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
              return
            fi
            rm -f "${error_file}"

            metadata_file=$(mktemp)
            payload_file=$(mktemp)
            echo "Invoking Lambda: ${function_name}"
            retry aws lambda invoke \
              --function-name "${function_name}" \
              "${payload_file}" >"${metadata_file}" 2>&1
            invoke_status=$?

            tee -a aws.log <"${metadata_file}"
            if [ -s "${payload_file}" ]; then
              tee -a aws.log <"${payload_file}"
            fi

            database_status=$(jq -r '.status // empty' "${payload_file}" 2>/dev/null || true)
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "database_status=${database_status}" >>"${GITHUB_OUTPUT}"
            fi

            if [ "${invoke_status}" -ne 0 ]; then
              record_failure "AWS invocation ${function_name}"
            elif grep -q '"FunctionError"' "${metadata_file}"; then
              record_failure "Lambda execution ${function_name}"
            elif [ "${database_status}" != "deleted" ] && [ "${database_status}" != "already_absent" ]; then
              record_failure "Unexpected database cleanup status for ${function_name}: ${database_status:-missing}"
            fi

            rm -f "${metadata_file}" "${payload_file}"
          }

          disable_cloudfront() {
            local stack_name="cms-eregs-eph-${PR_NUMBER}-static-assets"
            local distribution_id
            local config_file
            local disabled_config_file
            local etag
            local state
            local error_file

            stack_state "${stack_name}"
            state=$?
            case "${state}" in
              1)
                echo "Static-assets stack already absent: ${stack_name}"
                return 0
                ;;
              2)
                return 1
                ;;
            esac

            error_file=$(mktemp)
            distribution_id=$(retry_aws "${error_file}" 'does not exist|not exist' \
              aws cloudformation describe-stacks \
              --stack-name "${stack_name}" \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
              --output text)
            local state=$?
            if [ "${state}" -ne 0 ]; then
              record_failure "Read CloudFormation outputs ${stack_name}: $(tr '\n' ' ' <"${error_file}")"
              rm -f "${error_file}"
              return 1
            fi
            rm -f "${error_file}"
            if [ -z "${distribution_id}" ] || [ "${distribution_id}" = "None" ]; then
              echo "No CloudFront distribution output found for ${stack_name}"
              return 0
            fi

            config_file=$(mktemp)
            disabled_config_file=$(mktemp)
            if ! retry aws cloudfront get-distribution-config --id "${distribution_id}" >"${config_file}"; then
              record_failure "Read CloudFront distribution ${distribution_id}"
              rm -f "${config_file}" "${disabled_config_file}"
              return
            fi

            etag=$(jq -r '.ETag' "${config_file}")
            if ! jq '.DistributionConfig.Enabled = false | .DistributionConfig' "${config_file}" >"${disabled_config_file}"; then
              record_failure "Prepare CloudFront disablement ${distribution_id}"
            elif ! retry aws cloudfront update-distribution \
              --id "${distribution_id}" \
              --distribution-config "file://${disabled_config_file}" \
              --if-match "${etag}"; then
              record_failure "Disable CloudFront distribution ${distribution_id}"
            elif ! retry aws cloudfront wait distribution-deployed --id "${distribution_id}"; then
              record_failure "Wait for CloudFront distribution ${distribution_id}"
            fi

            rm -f "${config_file}" "${disabled_config_file}"
          }

          cleanup_bucket() {
            local bucket_name="$1"
            local error_file

            error_file=$(mktemp)
            retry_aws "${error_file}" 'not found|no such bucket|404' \
              aws s3api head-bucket --bucket "${bucket_name}" >/dev/null
            local state=$?
            if [ "${state}" -ne 0 ]; then
              if [ "${state}" -eq 2 ]; then
                echo "Bucket already absent: ${bucket_name}"
              else
                record_failure "Inspect S3 bucket ${bucket_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
              return 0
            fi
            rm -f "${error_file}"

            echo "Deleting bucket: ${bucket_name}"
            if ! retry aws s3 rm "s3://${bucket_name}" --recursive || \
              ! retry aws s3api delete-bucket --bucket "${bucket_name}"; then
              record_failure "S3 bucket ${bucket_name}"
            fi
          }

          invoke_dropdb

          destroy_stack "cms-eregs-eph-${PR_NUMBER}-redirect-api"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-maintenance-api"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-ecfr-parser"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-fr-parser"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-api-mcp-server"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-api"
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-text-extractor"

          disable_cloudfront
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-static-assets"

          cleanup_bucket "cms-eregs-eph-${PR_NUMBER}-site-assets"
          cleanup_bucket "cms-eregs-eph-${PR_NUMBER}-cloudfront-logs"

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "Ephemeral cleanup completed with failures:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "Ephemeral cleanup completed successfully."

      - name: Verify ephemeral cleanup
        if: ${{ always() }}
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
          AWS_DEFAULT_REGION: us-east-1
          DATABASE_STATUS: ${{ steps.cleanup.outputs.database_status }}
        run: |
          set -uo pipefail

          if [[ -z "${PR_NUMBER}" || ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "A numeric PR number is required for ephemeral verification." >&2
            exit 1
          fi

          failures=()

          record_failure() {
            local label="$1"
            failures+=("${label}")
            echo "::error title=Ephemeral verification failed::${label}" >&2
          }

          retry() {
            local attempts=1
            local max_attempts=3
            local delay=10

            until "$@"; do
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          retry_aws() {
            local error_file="$1"
            local not_found_pattern="$2"
            shift 2
            local attempts=1
            local max_attempts=3
            local delay=10

            : >"${error_file}"
            until "$@" 2>"${error_file}"; do
              if [ -n "${not_found_pattern}" ] && grep -qiE "${not_found_pattern}" "${error_file}"; then
                return 2
              fi
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          check_stacks_absent() {
            local stack_name
            local error_file

            for stack_name in "$@"; do
              error_file=$(mktemp)
              retry_aws "${error_file}" 'does not exist|not exist|ResourceNotFoundException' \
                aws cloudformation describe-stacks \
                --stack-name "${stack_name}" >/dev/null
              local state=$?
              if [ "${state}" -eq 0 ]; then
                record_failure "CloudFormation stack remains: ${stack_name}"
              elif [ "${state}" -ne 2 ]; then
                record_failure "Could not verify CloudFormation stack ${stack_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
            done
          }

          check_lambdas_absent() {
            local function_name
            local error_file

            for function_name in "$@"; do
              error_file=$(mktemp)
              retry_aws "${error_file}" 'ResourceNotFoundException|Function not found|does not exist' \
                aws lambda get-function \
                --function-name "${function_name}" >/dev/null
              local state=$?
              if [ "${state}" -eq 0 ]; then
                record_failure "Lambda remains: ${function_name}"
              elif [ "${state}" -ne 2 ]; then
                record_failure "Could not verify Lambda ${function_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
            done
          }

          check_queues_absent() {
            local queue_name
            local error_file

            for queue_name in "$@"; do
              error_file=$(mktemp)
              retry_aws "${error_file}" 'QueueDoesNotExist|does not exist|not exist' \
                aws sqs get-queue-url \
                --queue-name "${queue_name}" >/dev/null
              local state=$?
              if [ "${state}" -eq 0 ]; then
                record_failure "SQS queue remains: ${queue_name}"
              elif [ "${state}" -ne 2 ]; then
                record_failure "Could not verify SQS queue ${queue_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
            done
          }

          check_schedules_absent() {
            local schedule_name
            local error_file

            for schedule_name in "$@"; do
              error_file=$(mktemp)
              retry_aws "${error_file}" 'ResourceNotFoundException|not found|does not exist' \
                aws scheduler get-schedule \
                --name "${schedule_name}" >/dev/null
              local state=$?
              if [ "${state}" -eq 0 ]; then
                record_failure "EventBridge Scheduler schedule remains: ${schedule_name}"
              elif [ "${state}" -ne 2 ]; then
                record_failure "Could not verify Scheduler schedule ${schedule_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
            done
          }

          check_log_groups_absent() {
            local log_group_name
            local output_file
            local error_file
            local matches

            for log_group_name in "$@"; do
              output_file=$(mktemp)
              error_file=$(mktemp)
              if ! retry aws logs describe-log-groups \
                --log-group-name-prefix "${log_group_name}" \
                --query "logGroups[?logGroupName=='${log_group_name}'].logGroupName" \
                --output text >"${output_file}" 2>"${error_file}"; then
                record_failure "Could not verify CloudWatch log group ${log_group_name}: $(tr '\n' ' ' <"${error_file}")"
              else
                matches=$(tr -d '[:space:]' <"${output_file}")
                if [ -n "${matches}" ] && [ "${matches}" != "None" ]; then
                  record_failure "CloudWatch log group remains: ${log_group_name}"
                fi
              fi
              rm -f "${output_file}" "${error_file}"
            done
          }

          check_buckets_absent() {
            local bucket_name
            local error_file

            for bucket_name in "$@"; do
              error_file=$(mktemp)
              retry_aws "${error_file}" 'not found|no such bucket|404' \
                aws s3api head-bucket \
                --bucket "${bucket_name}" >/dev/null
              local state=$?
              if [ "${state}" -eq 0 ]; then
                record_failure "S3 bucket remains: ${bucket_name}"
              elif [ "${state}" -ne 2 ]; then
                record_failure "Could not verify S3 bucket ${bucket_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
            done
          }

          check_apis_absent() {
            local api_name
            local output_file
            local error_file
            local api_count

            for api_name in "$@"; do
              output_file=$(mktemp)
              error_file=$(mktemp)
              if ! retry aws apigateway get-rest-apis \
                --limit 500 \
                --query "items[?name=='${api_name}'] | length(@)" \
                --output text >"${output_file}" 2>"${error_file}"; then
                record_failure "Could not verify API Gateway ${api_name}: $(tr '\n' ' ' <"${error_file}")"
              else
                api_count=$(tr -d '[:space:]' <"${output_file}")
                if [ "${api_count}" != "0" ]; then
                  record_failure "API Gateway remains: ${api_name}"
                fi
              fi
              rm -f "${output_file}" "${error_file}"
            done
          }

          check_cloudfront_absent() {
            local distribution_comment="$1"
            local output_file
            local error_file
            local distribution_ids

            output_file=$(mktemp)
            error_file=$(mktemp)
            if ! retry aws cloudfront list-distributions \
              --query "DistributionList.Items[?Comment=='${distribution_comment}'].Id" \
              --output text >"${output_file}" 2>"${error_file}"; then
              record_failure "Could not verify CloudFront distribution ${distribution_comment}: $(tr '\n' ' ' <"${error_file}")"
            else
              distribution_ids=$(tr -d '[:space:]' <"${output_file}")
              if [ -n "${distribution_ids}" ] && [ "${distribution_ids}" != "None" ]; then
                record_failure "CloudFront distribution remains: ${distribution_comment}"
              fi
            fi
            rm -f "${output_file}" "${error_file}"
          }

          check_wafs_absent() {
            local scope="$1"
            local region="$2"
            shift 2
            local waf_name
            local output_file
            local error_file
            local waf_id

            for waf_name in "$@"; do
              output_file=$(mktemp)
              error_file=$(mktemp)
              if ! retry aws wafv2 list-web-acls \
                --scope "${scope}" \
                --region "${region}" \
                --query "WebACLs[?Name=='${waf_name}'].Id | [0]" \
                --output text >"${output_file}" 2>"${error_file}"; then
                record_failure "Could not verify WAF ${waf_name}: $(tr '\n' ' ' <"${error_file}")"
              else
                waf_id=$(tr -d '[:space:]' <"${output_file}")
                if [ -n "${waf_id}" ] && [ "${waf_id}" != "None" ]; then
                  record_failure "WAF Web ACL remains: ${waf_name}"
                fi
              fi
              rm -f "${output_file}" "${error_file}"
            done
          }

          PREFIX="cms-eregs-eph-${PR_NUMBER}"

          if [ "${DATABASE_STATUS}" != "deleted" ] && [ "${DATABASE_STATUS}" != "already_absent" ]; then
            record_failure "Database cleanup was not verified: ${DATABASE_STATUS:-missing}"
          fi

          check_stacks_absent \
            "${PREFIX}-redirect-api" \
            "${PREFIX}-maintenance-api" \
            "${PREFIX}-ecfr-parser" \
            "${PREFIX}-fr-parser" \
            "${PREFIX}-api-mcp-server" \
            "${PREFIX}-api" \
            "${PREFIX}-text-extractor" \
            "${PREFIX}-static-assets"

          check_apis_absent \
            "${PREFIX}-api" \
            "${PREFIX}-api-gateway" \
            "${PREFIX}-maintenance-api" \
            "${PREFIX}-api-mcp-server"

          check_lambdas_absent \
            "${PREFIX}-regsite" \
            "${PREFIX}-migrate" \
            "${PREFIX}-createdb" \
            "${PREFIX}-dropdb" \
            "${PREFIX}-createsu" \
            "${PREFIX}-authorizer" \
            "${PREFIX}-redirect-function" \
            "${PREFIX}-maintenance-function" \
            "${PREFIX}-text-extractor" \
            "${PREFIX}-mcp-server-mcp-server" \
            "${PREFIX}-ecfr-parser-worker" \
            "${PREFIX}-ecfr-parser-launcher" \
            "${PREFIX}-fr-parser-worker" \
            "${PREFIX}-fr-parser-launcher"

          check_queues_absent \
            "${PREFIX}-ecfr-parser-queue" \
            "${PREFIX}-ecfr-parser-dlq" \
            "${PREFIX}-fr-parser-queue" \
            "${PREFIX}-fr-parser-dlq" \
            "${PREFIX}-text-extractor-queue.fifo" \
            "${PREFIX}-text-extractor-dl-queue.fifo"

          check_schedules_absent \
            "${PREFIX}-ecfr-parser-schedule" \
            "${PREFIX}-fr-parser-schedule"

          check_buckets_absent \
            "${PREFIX}-file-repo-eregs" \
            "${PREFIX}-textract-bucket" \
            "${PREFIX}-site-assets" \
            "${PREFIX}-cloudfront-logs"

          check_log_groups_absent \
            "/aws/lambda/${PREFIX}-regsite" \
            "/aws/lambda/${PREFIX}-migrate" \
            "/aws/lambda/${PREFIX}-createdb" \
            "/aws/lambda/${PREFIX}-dropdb" \
            "/aws/lambda/${PREFIX}-createsu" \
            "/aws/lambda/${PREFIX}-authorizer" \
            "/aws/lambda/${PREFIX}-redirect-function" \
            "/aws/lambda/${PREFIX}-maintenance-function" \
            "/aws/lambda/${PREFIX}-text-extractor" \
            "/aws/lambda/${PREFIX}-mcp-server-mcp-server" \
            "/aws/lambda/${PREFIX}-ecfr-parser-worker" \
            "/aws/lambda/${PREFIX}-ecfr-parser-launcher" \
            "/aws/lambda/${PREFIX}-fr-parser-worker" \
            "/aws/lambda/${PREFIX}-fr-parser-launcher" \
            "/aws/api-gateway/${PREFIX}-api" \
            "/aws/api-gateway/${PREFIX}-api-gateway" \
            "/aws/api-gateway/${PREFIX}-maintenance-api" \
            "/aws/api-gateway/${PREFIX}-api-mcp-server" \
            "aws-waf-logs-${PREFIX}-waf" \
            "aws-waf-logs-${PREFIX}-waf-mcp-server"

          check_cloudfront_absent "CloudFront Distribution for ${PREFIX}-site"

          check_wafs_absent REGIONAL "${AWS_DEFAULT_REGION}" \
            "${PREFIX}-apigateway-eregs-allow-usa-plus-territories" \
            "${PREFIX}-apigateway-eregs-allow-usa-plus-territories-mcp-server"
          check_wafs_absent CLOUDFRONT us-east-1 "${PREFIX}-cloudfront-acl"

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "Ephemeral verification found remnants or verification failures:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "No exact ephemeral stacks, endpoints, resources, or database remnants found."
