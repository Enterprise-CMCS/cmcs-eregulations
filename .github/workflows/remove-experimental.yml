name: Remove Experimental Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to clean up"
        required: true
        type: string
  pull_request:
    types: [ closed ]

permissions:
  id-token: write
  contents: read

jobs:
  remove:
    environment:
      name: "dev"
    runs-on: ubuntu-24.04
    steps:
      - name: Echo PR#
        env:
          PR: ${{ inputs.pr_number || github.event.number }}
        run: echo "Your PR is ${PR}"

      # Checkout the code
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Setup Node
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Setup Python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Configure AWS credentials for GitHub Actions
      - name: Configure AWS credentials for GitHub Actions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Cleanup all ephemeral resources
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          ENVIRONMENT_NAME: dev
        run: |
          set -uo pipefail
          # GitHub Actions invokes run steps with errexit; cleanup must attempt every phase.
          set +e

          if [[ -z "${PR_NUMBER}" || ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "A numeric PR number is required for ephemeral cleanup." >&2
            exit 1
          fi

          failures=()

          record_failure() {
            local label="$1"
            failures+=("${label}")
            echo "::error title=Ephemeral cleanup failed::${label}" >&2
          }

          retry() {
            local attempts=1
            local max_attempts=3
            local delay=10

            until "$@"; do
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          retry_aws() {
            local error_file="$1"
            local not_found_pattern="$2"
            shift 2
            local attempts=1
            local max_attempts=3
            local delay=10

            : >"${error_file}"
            until "$@" 2>"${error_file}"; do
              if [ -n "${not_found_pattern}" ] && grep -qiE "${not_found_pattern}" "${error_file}"; then
                return 2
              fi
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempts}/${max_attempts}): $*" >&2
              sleep "${delay}"
              attempts=$((attempts + 1))
              delay=$((delay * 2))
            done
          }

          stack_state() {
            local stack_name="$1"
            local error_file
            local state
            error_file=$(mktemp)

            if retry_aws "${error_file}" 'does not exist|not exist' \
              aws cloudformation describe-stacks --stack-name "${stack_name}" >/dev/null; then
              state=0
            else
              state=$?
            fi
            if [ "${state}" -eq 0 ]; then
              rm -f "${error_file}"
              return 0
            fi

            if [ "${state}" -eq 2 ]; then
              rm -f "${error_file}"
              return 1
            fi

            record_failure "Inspect CloudFormation stack ${stack_name}: $(tr '\n' ' ' <"${error_file}")"
            rm -f "${error_file}"
            return 2
          }

          destroy_stack() {
            local stack_name="$1"
            local state

            if stack_state "${stack_name}"; then
              state=0
            else
              state=$?
            fi
            case "${state}" in
              1)
                echo "Stack already absent: ${stack_name}"
                return 0
                ;;
              2)
                return 1
                ;;
            esac

            echo "Destroying stack: ${stack_name}"
            if ! retry aws cloudformation delete-stack --stack-name "${stack_name}"; then
              record_failure "CloudFormation stack ${stack_name}"
              return
            fi

            if ! retry aws cloudformation wait stack-delete-complete --stack-name "${stack_name}"; then
              record_failure "CloudFormation stack deletion ${stack_name}"
            fi
          }

          invoke_dropdb() {
            local function_name="cms-eregs-eph-${PR_NUMBER}-dropdb"
            local metadata_file
            local payload_file
            local invoke_status
            local error_file
            local database_status
            local state

            error_file=$(mktemp)
            if retry_aws "${error_file}" 'ResourceNotFoundException|Function not found|does not exist' \
              aws lambda get-function --function-name "${function_name}" >/dev/null; then
              state=0
            else
              state=$?
            fi
            if [ "${state}" -ne 0 ]; then
              if [ "${state}" -eq 2 ]; then
                record_failure "Missing cleanup Lambda ${function_name}; database deletion cannot be verified"
              else
                record_failure "Inspect cleanup Lambda ${function_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
              return
            fi
            rm -f "${error_file}"

            metadata_file=$(mktemp)
            payload_file=$(mktemp)
            echo "Invoking Lambda: ${function_name}"
            if retry aws lambda invoke \
              --function-name "${function_name}" \
              "${payload_file}" >"${metadata_file}" 2>&1; then
              invoke_status=0
            else
              invoke_status=$?
            fi

            tee -a aws.log <"${metadata_file}"
            if [ -s "${payload_file}" ]; then
              tee -a aws.log <"${payload_file}"
            fi

            database_status=$(jq -r '.status // empty' "${payload_file}" 2>/dev/null || true)

            if [ "${invoke_status}" -ne 0 ]; then
              record_failure "AWS invocation ${function_name}"
            elif grep -q '"FunctionError"' "${metadata_file}"; then
              record_failure "Lambda execution ${function_name}"
            elif [ "${database_status}" != "deleted" ] && [ "${database_status}" != "already_absent" ]; then
              record_failure "Unexpected database cleanup status for ${function_name}: ${database_status:-missing}"
            fi

            rm -f "${metadata_file}" "${payload_file}"
          }

          disable_cloudfront() {
            local stack_name="cms-eregs-eph-${PR_NUMBER}-static-assets"
            local distribution_id
            local config_file
            local disabled_config_file
            local etag
            local state
            local error_file

            if stack_state "${stack_name}"; then
              state=0
            else
              state=$?
            fi
            case "${state}" in
              1)
                echo "Static-assets stack already absent: ${stack_name}"
                return 0
                ;;
              2)
                return 1
                ;;
            esac

            error_file=$(mktemp)
            if distribution_id=$(retry_aws "${error_file}" 'does not exist|not exist' \
              aws cloudformation describe-stacks \
              --stack-name "${stack_name}" \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
              --output text); then
              state=0
            else
              state=$?
            fi
            if [ "${state}" -ne 0 ]; then
              record_failure "Read CloudFormation outputs ${stack_name}: $(tr '\n' ' ' <"${error_file}")"
              rm -f "${error_file}"
              return 1
            fi
            rm -f "${error_file}"
            if [ -z "${distribution_id}" ] || [ "${distribution_id}" = "None" ]; then
              echo "No CloudFront distribution output found for ${stack_name}"
              return 0
            fi

            config_file=$(mktemp)
            disabled_config_file=$(mktemp)
            if ! retry aws cloudfront get-distribution-config --id "${distribution_id}" >"${config_file}"; then
              record_failure "Read CloudFront distribution ${distribution_id}"
              rm -f "${config_file}" "${disabled_config_file}"
              return
            fi

            etag=$(jq -r '.ETag' "${config_file}")
            if ! jq '.DistributionConfig.Enabled = false | .DistributionConfig' "${config_file}" >"${disabled_config_file}"; then
              record_failure "Prepare CloudFront disablement ${distribution_id}"
            elif ! retry aws cloudfront update-distribution \
              --id "${distribution_id}" \
              --distribution-config "file://${disabled_config_file}" \
              --if-match "${etag}"; then
              record_failure "Disable CloudFront distribution ${distribution_id}"
            elif ! retry aws cloudfront wait distribution-deployed --id "${distribution_id}"; then
              record_failure "Wait for CloudFront distribution ${distribution_id}"
            fi

            rm -f "${config_file}" "${disabled_config_file}"
          }

          cleanup_bucket() {
            local bucket_name="$1"
            local error_file
            local state

            error_file=$(mktemp)
            if retry_aws "${error_file}" 'not found|no such bucket|404' \
              aws s3api head-bucket --bucket "${bucket_name}" >/dev/null; then
              state=0
            else
              state=$?
            fi
            if [ "${state}" -ne 0 ]; then
              if [ "${state}" -eq 2 ]; then
                echo "Bucket already absent: ${bucket_name}"
              else
                record_failure "Inspect S3 bucket ${bucket_name}: $(tr '\n' ' ' <"${error_file}")"
              fi
              rm -f "${error_file}"
              return 0
            fi
            rm -f "${error_file}"

            echo "Deleting bucket: ${bucket_name}"
            if ! retry aws s3 rm "s3://${bucket_name}" --recursive || \
              ! retry aws s3api delete-bucket --bucket "${bucket_name}"; then
              record_failure "S3 bucket ${bucket_name}"
            fi
          }

          invoke_dropdb || true

          destroy_stack "cms-eregs-eph-${PR_NUMBER}-redirect-api" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-maintenance-api" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-ecfr-parser" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-fr-parser" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-api-mcp-server" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-api" || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-text-extractor" || true

          disable_cloudfront || true
          destroy_stack "cms-eregs-eph-${PR_NUMBER}-static-assets" || true

          cleanup_bucket "cms-eregs-eph-${PR_NUMBER}-site-assets" || true
          cleanup_bucket "cms-eregs-eph-${PR_NUMBER}-cloudfront-logs" || true

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "Ephemeral cleanup completed with failures:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "Ephemeral cleanup completed successfully."
